<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indominuz</title>

<style>
body{font-family:Arial;background:#0f172a;color:white;padding:10px}
.card{background:#1e293b;padding:12px;border-radius:12px;margin-bottom:10px}
button{padding:10px;border:none;border-radius:10px;margin:4px;font-weight:bold;background:#334155;color:white}
.success{background:#22c55e}
.danger{background:#ef4444}
</style>
</head>

<body>

<div class="card">
<h2>Indominuz</h2>
<div id="hp"></div>
<div id="ki"></div>
</div>

<div class="card">
<button onclick="hpChange(-5)" class="danger">-5 HP</button>
<button onclick="hpChange(5)" class="success">+5 HP</button>
</div>

<div class="card">
<button onclick="attack()">Attack</button>
<button onclick="flurry()">Flurry</button>
</div>

<div class="card" id="log"></div>

<script>
let hp = 26;
let level = 3;
let dex = 16;
let con = 14;
let ki = 3;
let logs = [];

function mod(x){ return Math.floor((x-10)/2); }

function maxHp(){
  return 8 + mod(con) + ((level-1)*(5+mod(con)));
}

function attackBonus(){
  return mod(dex)+2;
}

function hpChange(n){
  hp += n;
  if(hp<0) hp=0;
  if(hp>maxHp()) hp=maxHp();
  log("HP "+n);
  render();
}

function attack(){
  let roll = Math.floor(Math.random()*20)+1;
  let total = roll + attackBonus();
  log("Attack: "+total);
  render();
}

function flurry(){
  if(ki<=0){
    log("No Ki");
    render();
    return;
  }
  ki--;
  let dmg = Math.floor(Math.random()*4)+1 + mod(dex);
  log("Flurry dmg: "+dmg);
  render();
}

function log(text){
  logs.unshift(text);
  logs = logs.slice(0,10);
}

function render(){
  document.getElementById("hp").textContent = "HP: "+hp+"/"+maxHp();
  document.getElementById("ki").textContent = "Ki: "+ki;
  document.getElementById("log").innerHTML = logs.map(x=>"<div>"+x+"</div>").join("");
}

render();
</script>

</body>
</html>
