<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indominuz V2</title>

<style>
body{background:#0f172a;color:white;font-family:Arial;margin:0;padding:10px}
.card{background:#1e293b;padding:12px;border-radius:14px;margin-bottom:10px}
button{padding:10px;border:none;border-radius:10px;margin:4px;font-weight:bold;color:white;background:#334155}
.primary{background:#3b82f6}
.success{background:#22c55e}
.danger{background:#ef4444}
.enemy{background:#020617;padding:10px;border-radius:10px;margin-top:8px;border:2px solid transparent}
.enemy.active{border:2px solid #3b82f6}
.hpbar{height:8px;background:#ef4444;border-radius:10px;margin-top:4px}
.turn{outline:2px solid yellow}
.log{font-size:.9rem;color:#cbd5f5}
</style>
</head>

<body>

<h2>🐾 Indominuz V2</h2>

<div class="card">
HP <span id="hp">26</span>/<span id="maxHp">26</span> |
Ki <span id="ki">3</span>
</div>

<div class="card">
<button onclick="attack()">Attack</button>
<button onclick="flurry()">Flurry</button>
<button onclick="nextTurn()">Next Turn</button>
<div id="result"></div>
</div>

<div class="card">
<h3>Enemies</h3>
<input id="name" placeholder="Name">
<input id="hpInput" type="number" placeholder="HP">
<input id="acInput" type="number" placeholder="AC">
<input id="initInput" type="number" placeholder="Init">
<button onclick="addEnemy()">Add</button>

<div id="enemies"></div>
</div>

<div class="card">
<h3>Log</h3>
<div id="log"></div>
</div>

<script>

let state = JSON.parse(localStorage.getItem("v2")) || {
hp:26,maxHp:26,ki:3,
enemies:[],
turn:0,
round:1,
target:null,
log:[]
};

function save(){localStorage.setItem("v2",JSON.stringify(state));}

function log(t){
state.log.unshift(t);
renderLog();
}

function roll(d){return Math.floor(Math.random()*d)+1}

function attack(){
if(state.target===null)return alert("Select target!");

let e=state.enemies[state.target];
let r=roll(20);
let total=r+5;

if(r===20){
let dmg=roll(8)+3+roll(8);
e.hp-=dmg;
log("CRIT! "+dmg);
}else if(total>=e.ac){
let dmg=roll(8)+3;
e.hp-=dmg;
log("Hit "+dmg);
}else{
log("Miss");
}

render();
}

function flurry(){
if(state.ki<=0)return;
state.ki--;

for(let i=0;i<2;i++) attack();

render();
}

function addEnemy(){
let n=name.value;
let hp=parseInt(hpInput.value);
let ac=parseInt(acInput.value);
let init=parseInt(initInput.value)||0;

state.enemies.push({name:n,hp,maxHp:hp,ac,init});
state.enemies.sort((a,b)=>b.init-a.init);
render();
}

function renderEnemies(){
enemies.innerHTML=state.enemies.map((e,i)=>{
let percent=(e.hp/e.maxHp)*100;
return `
<div class="enemy ${i===state.target?'active':''} ${i===state.turn?'turn':''}"
onclick="select(${i})">
<b>${e.name}</b> AC:${e.ac}<br>
${e.hp}/${e.maxHp}
<div class="hpbar" style="width:${percent}%"></div>
</div>
`;
}).join("");
}

function select(i){
state.target=i;
render();
}

function nextTurn(){
state.turn++;
if(state.turn>=state.enemies.length){
state.turn=0;
state.round++;
}
log("Round "+state.round);
render();
}

function renderLog(){
log.innerHTML=state.log.map(x=>"<div class='log'>"+x+"</div>").join("");
}

function render(){
hp.innerText=state.hp;
ki.innerText=state.ki;
renderEnemies();
renderLog();
save();
}

render();

</script>

</body>
</html>
