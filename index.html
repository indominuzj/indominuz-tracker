<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indominuz</title>
<style>
:root{
  --bg:#0f172a;
  --panel:#14213d;
  --panel2:#1e293b;
  --line:rgba(255,255,255,.08);
  --text:#f8fafc;
  --muted:#cbd5e1;
  --blue:#3b82f6;
  --green:#22c55e;
  --red:#ef4444;
  --amber:#f59e0b;
  --shadow:0 12px 28px rgba(0,0,0,.28);
  --radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:12px;
  font-family:Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top, rgba(59,130,246,.18), transparent 30%),
    linear-gradient(180deg,#08111f,var(--bg));
  color:var(--text);
}
.app{max-width:900px;margin:0 auto}
.card{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}
.hero{
  padding:18px;
}
.hero h1{
  margin:0 0 4px 0;
  font-size:2rem;
}
.subtitle{
  color:var(--muted);
  font-size:.95rem;
}
.stats-top{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:14px;
}
.statbox{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;
  padding:12px;
}
.label{
  color:var(--muted);
  font-size:.82rem;
  margin-bottom:4px;
}
.value{
  font-size:1.35rem;
  font-weight:800;
}
button{
  border:none;
  border-radius:12px;
  padding:11px 14px;
  margin:4px;
  font-weight:800;
  color:white;
  background:#334155;
  cursor:pointer;
  box-shadow:var(--shadow);
}
button:active{transform:scale(.98)}
.primary{background:linear-gradient(135deg,#2563eb,var(--blue))}
.success{background:linear-gradient(135deg,#16a34a,var(--green))}
.danger{background:linear-gradient(135deg,#dc2626,var(--red))}
.warning{background:linear-gradient(135deg,#d97706,var(--amber))}
.button-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#334155;
  color:white;
  font-size:1rem;
}
.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.section-title{
  margin:0 0 12px 0;
  font-size:1.5rem;
}
.muted{
  color:var(--muted);
  font-size:.92rem;
}
.log{
  display:grid;
  gap:8px;
}
.log div{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.06);
  border-radius:12px;
  padding:10px;
}
.derived{
  line-height:1.65;
  color:#e2e8f0;
}
.stat-label-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:6px;
}
.mod-badge{
  display:inline-block;
  min-width:44px;
  text-align:center;
  padding:4px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  color:#e2e8f0;
  font-size:.85rem;
  font-weight:800;
}
@media (max-width:700px){
  .stats-top,.grid-2{grid-template-columns:1fr}
  button{width:100%;margin:0}
  .button-row{display:grid}
}
</style>
</head>
<body>
<div class="app">

  <div class="card hero">
    <h1>🐾 Indominuz</h1>
    <div class="subtitle">Tabaxi Monk • Clean Safe Build</div>

    <div class="stats-top">
      <div class="statbox">
        <div class="label">HP</div>
        <div class="value" id="hp">26/24</div>
      </div>
      <div class="statbox">
        <div class="label">Ki</div>
        <div class="value" id="ki">3/3</div>
      </div>
      <div class="statbox">
        <div class="label">Level</div>
        <div class="value" id="levelText">3</div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 class="section-title">Combat</h2>
    <div class="button-row">
      <button onclick="hpChange(-5)" class="danger">-5 HP</button>
      <button onclick="hpChange(5)" class="success">+5 HP</button>
      <button onclick="useKi()" class="warning">Use Ki</button>
      <button onclick="restoreKi()" class="success">Restore Ki</button>
      <button onclick="attack()" class="primary">Attack</button>
      <button onclick="flurry()">Flurry</button>
    </div>
  </div>

  <div class="card">
    <h2 class="section-title">Character Stat Points</h2>
    <div class="grid-2">
      <div>
        <div class="label">Level</div>
        <input id="levelInput" type="number" min="1" max="20">
      </div>
      <div>
        <div class="label">Current HP</div>
        <input id="currentHpInput" type="number" min="0">
      </div>

      <div>
        <div class="stat-label-row">
          <div class="label">STR</div>
          <div class="mod-badge" id="strModBadge">+0</div>
        </div>
        <input id="strInput" type="number" min="1" max="20">
      </div>

      <div>
        <div class="stat-label-row">
          <div class="label">DEX</div>
          <div class="mod-badge" id="dexModBadge">+3</div>
        </div>
        <input id="dexInput" type="number" min="1" max="20">
      </div>

      <div>
        <div class="stat-label-row">
          <div class="label">CON</div>
          <div class="mod-badge" id="conModBadge">+2</div>
        </div>
        <input id="conInput" type="number" min="1" max="20">
      </div>

      <div>
        <div class="stat-label-row">
          <div class="label">INT</div>
          <div class="mod-badge" id="intModBadge">-1</div>
        </div>
        <input id="intInput" type="number" min="1" max="20">
      </div>

      <div>
        <div class="stat-label-row">
          <div class="label">WIS</div>
          <div class="mod-badge" id="wisModBadge">+2</div>
        </div>
        <input id="wisInput" type="number" min="1" max="20">
      </div>

      <div>
        <div class="stat-label-row">
          <div class="label">CHA</div>
          <div class="mod-badge" id="chaModBadge">+0</div>
        </div>
        <input id="chaInput" type="number" min="1" max="20">
      </div>
    </div>

    <div style="margin-top:12px">
      <button onclick="saveStats()" class="success">Save Stats</button>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <h2 class="section-title">Derived Stats</h2>
      <div id="derivedStats" class="derived"></div>
    </div>

    <div class="card">
      <h2 class="section-title">Log</h2>
      <div id="log" class="log"></div>
    </div>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const STORAGE_KEY = "indominuz_clean_ui_v2";

const defaultState = {
  hp: 24,
  level: 3,
  str: 10,
  dex: 16,
  con: 14,
  intStat: 8,
  wis: 15,
  cha: 10,
  kiSpent: 0,
  logs: []
};

function load(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(!saved) return {...defaultState};
    return {...defaultState, ...saved};
  }catch(e){
    return {...defaultState};
  }
}

let state = load();

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function mod(x){
  return Math.floor((x - 10) / 2);
}

function profBonus(){
  if(state.level >= 17) return 6;
  if(state.level >= 13) return 5;
  if(state.level >= 9) return 4;
  if(state.level >= 5) return 3;
  return 2;
}

function maxHp(){
  return Math.max(1, 8 + mod(state.con) + ((state.level - 1) * (5 + mod(state.con))));
}

function kiMax(){
  return state.level >= 2 ? state.level : 0;
}

function kiCurrent(){
  return Math.max(0, kiMax() - state.kiSpent);
}

function attackBonus(){
  return mod(state.dex) + profBonus();
}

function saveDc(){
  return 8 + profBonus() + mod(state.wis);
}

function clamp(value, min, max){
  return Math.max(min, Math.min(max, value));
}

function log(text){
  state.logs.unshift(text);
  state.logs = state.logs.slice(0, 12);
}

function hpChange(n){
  state.hp += n;
  state.hp = clamp(state.hp, 0, maxHp());
  log("HP " + (n > 0 ? "+" : "") + n);
  render();
}

function useKi(){
  if(kiCurrent() <= 0){
    log("No Ki left");
    render();
    return;
  }
  state.kiSpent++;
  log("Used 1 Ki");
  render();
}

function restoreKi(){
  if(state.kiSpent > 0){
    state.kiSpent--;
    log("Restored 1 Ki");
  } else {
    log("Ki already full");
  }
  render();
}

function attack(){
  const roll = Math.floor(Math.random() * 20) + 1;
  const total = roll + attackBonus();
  log("Attack roll: " + total + " (" + roll + " + " + attackBonus() + ")");
  render();
}

function flurry(){
  if(kiCurrent() <= 0){
    log("No Ki for Flurry");
    render();
    return;
  }
  state.kiSpent++;
  const dmg1 = Math.floor(Math.random() * 4) + 1 + mod(state.dex);
  const dmg2 = Math.floor(Math.random() * 4) + 1 + mod(state.dex);
  log("Flurry: " + dmg1 + " and " + dmg2 + " damage");
  render();
}

function saveStats(){
  state.level = clamp(Number(document.getElementById("levelInput").value || 3), 1, 20);
  state.str = clamp(Number(document.getElementById("strInput").value || 10), 1, 20);
  state.dex = clamp(Number(document.getElementById("dexInput").value || 16), 1, 20);
  state.con = clamp(Number(document.getElementById("conInput").value || 14), 1, 20);
  state.intStat = clamp(Number(document.getElementById("intInput").value || 8), 1, 20);
  state.wis = clamp(Number(document.getElementById("wisInput").value || 15), 1, 20);
  state.cha = clamp(Number(document.getElementById("chaInput").value || 10), 1, 20);
  state.hp = clamp(Number(document.getElementById("currentHpInput").value || state.hp), 0, maxHp());

  if(state.kiSpent > kiMax()) state.kiSpent = kiMax();

  log("Stats updated");
  render();
}

function formatMod(n){
  return n >= 0 ? "+" + n : String(n);
}

function renderInputs(){
  document.getElementById("levelInput").value = state.level;
  document.getElementById("currentHpInput").value = state.hp;
  document.getElementById("strInput").value = state.str;
  document.getElementById("dexInput").value = state.dex;
  document.getElementById("conInput").value = state.con;
  document.getElementById("intInput").value = state.intStat;
  document.getElementById("wisInput").value = state.wis;
  document.getElementById("chaInput").value = state.cha;
}

function renderModBadges(){
  document.getElementById("strModBadge").textContent = formatMod(mod(state.str));
  document.getElementById("dexModBadge").textContent = formatMod(mod(state.dex));
  document.getElementById("conModBadge").textContent = formatMod(mod(state.con));
  document.getElementById("intModBadge").textContent = formatMod(mod(state.intStat));
  document.getElementById("wisModBadge").textContent = formatMod(mod(state.wis));
  document.getElementById("chaModBadge").textContent = formatMod(mod(state.cha));
}

function render(){
  state.hp = clamp(state.hp, 0, maxHp());

  document.getElementById("hp").textContent = state.hp + "/" + maxHp();
  document.getElementById("ki").textContent = kiCurrent() + "/" + kiMax();
  document.getElementById("levelText").textContent = state.level;

  document.getElementById("derivedStats").innerHTML =
    "Attack Bonus: +" + attackBonus() +
    "<br>Save DC: " + saveDc() +
    "<br>Max HP: " + maxHp() +
    "<br>Proficiency Bonus: +" + profBonus() +
    "<br>DEX Mod: " + formatMod(mod(state.dex)) +
    "<br>WIS Mod: " + formatMod(mod(state.wis)) +
    "<br>CON Mod: " + formatMod(mod(state.con));

  document.getElementById("log").innerHTML =
    state.logs.map(x => "<div>" + x + "</div>").join("");

  renderInputs();
  renderModBadges();
  save();
}

window.saveStats = saveStats;
window.hpChange = hpChange;
window.useKi = useKi;
window.restoreKi = restoreKi;
window.attack = attack;
window.flurry = flurry;

render();

});
</script>
</body>
</html>
